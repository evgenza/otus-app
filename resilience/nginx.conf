upstream messages {
    zone messages 64k;
    resolver 127.0.0.11 valid=2s ipv6=off;
    server app-1:8080 resolve max_fails=1 fail_timeout=3s;
    server app-2:8080 resolve max_fails=1 fail_timeout=3s;
}

server {
    listen 8080;
    # Ответ readiness о недоступной общей БД не исключает реплику из балансировки.
    location = /ready {
        proxy_pass http://messages;
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
    }
    location / {
        proxy_pass http://messages;
        proxy_connect_timeout 1s;
        proxy_read_timeout 8s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
