groups:
  - name: resilience
    rules:
      - alert: DependencyCircuitOpen
        expr: otus_circuit_breaker_state == 1
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: "Circuit breaker открыт для {{ $labels.dependency }}"
      - alert: RetryBudgetExhausted
        expr: sum by (dependency, operation) (increase(otus_retry_exhausted_total[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Исчерпаны попытки {{ $labels.operation }} в {{ $labels.dependency }}"
      - alert: OutboxDeliveryDelayed
        expr: max by (target) (otus_outbox_oldest_pending_seconds) > 15
        for: 6s
        labels:
          severity: warning
        annotations:
          summary: "События ожидают доставки в {{ $labels.target }}"
          description: "Проверьте доступность брокера и повторы outbox."
      - alert: ProjectionConsumerDown
        expr: sum(up{job="consumer"}) < 2
        for: 6s
        labels:
          severity: warning
        annotations:
          summary: "Одна из реплик потребителя недоступна"
      - alert: ProjectionErrors
        expr: sum by (broker) (increase(otus_broker_consumed_total{result=~"error|malformed"}[2m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Не удалось обновить проекцию из {{ $labels.broker }}"
